<!DOCTYPE html><html><body style="font-family:system-ui,sans-serif;background:#050811;color:#f1f5f9;max-width:780px;margin:0 auto;padding:28px"><h1>APUMIA Orbital-Sim Core — no_std Rust LEO Telemetry Verifier</h1><p>Zero-Allocation, Zero-Float Satellite Delta-V &amp; Station-Keeping Calculator (APUMIA Space)</p><div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:20px"><label>LEO Orbital Altitude (Meters):</label><input id="al" type="number" value="550000" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>Onboard Propellant Mass (Grams):</label><input id="pr" type="number" value="12000" style="width:100%;margin:4px 0 10px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><label>Required Station-Keeping &amp; Deorbit Delta-V (mm/s):</label><input id="dv" type="number" value="250000" style="width:100%;margin:4px 0 12px;padding:8px;background:#030712;color:#fff;border:1px solid #334155"><button onclick="const av=(+pr.value)*25,ok=(+al.value>=350000)&&(av>=+dv.value);r.textContent=`Available Delta-V: ${av.toLocaleString()} mm/s | Altitude: ${(+al.value/1000).toFixed(1)} km | Status: ${ok?'MISSION NOMINAL (no_std VERIFIED)':'ORBITAL / PROPELLANT MARGIN ALERT'}`" style="padding:11px 18px;border:none;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer">Verify LEO Telemetry</button><pre id="r" style="margin-top:14px;color:#34d399;font-size:15px"></pre></div><script src="../apumia-demo-seal.js"></script>
</body></html>
